<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Écriture 汉字</title>
<script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
body{font-family:system-ui;background:#f6f1e7;color:#2b2b2b;margin:0;display:flex;flex-direction:column;align-items:center;touch-action:manipulation;padding-bottom:30px}
h1{font-weight:400;margin:14px 0 4px}
#info{text-align:center;min-height:60px}
#pinyin{font-size:28px;color:#a33}#sens{font-size:18px}
#target{background:#fffdf8;border:1px solid #c9b99a;border-radius:12px;margin:10px;touch-action:none}
button,label.btn{font-size:16px;padding:9px 14px;margin:4px;border-radius:10px;border:1px solid #a33;background:#fff;cursor:pointer;display:inline-block}
#stats{font-size:14px;color:#777;margin:6px}
#msg{min-height:24px;font-size:18px;text-align:center}
#histoire{display:none;max-width:320px;background:#fffdf8;border-left:4px solid #a33;padding:10px 14px;margin:8px;border-radius:6px;font-size:15px;line-height:1.4}
#histoire b{color:#a33}
#outils{margin-top:10px;font-size:13px;color:#777;text-align:center;max-width:330px}
#suite{display:none}
</style></head><body>
<h1>Écriture 汉字</h1>
<div id="stats"></div>
<div id="info"><div id="pinyin"></div><div id="sens"></div></div>
<svg id="target" width="300" height="300">
<line x1="0" y1="0" x2="300" y2="300" stroke="#eee"/><line x1="300" y1="0" x2="0" y2="300" stroke="#eee"/>
<line x1="150" y1="0" x2="150" y2="300" stroke="#eee"/><line x1="0" y1="150" x2="300" y2="150" stroke="#eee"/></svg>
<div id="contexte" style="font-size:24px;text-align:center;min-height:30px"></div><div id="ctxfr" style="font-size:14px;color:#777;text-align:center"></div><div id="msg"></div>
<div id="histoire"></div>
<div><button onclick="montrer()">Montrer l'ordre</button><button onclick="indice()">Indice</button><button onclick="voirHistoire()">Histoire</button><button onclick="suivant()">Passer</button></div>
<button id="btnPy" onclick="togglePy()"></button>
<button id="suite" onclick="suivant()">Caractère suivant →</button>
<div id="outils">
<label class="btn">Importer Excel / CSV<input type="file" id="fichier" accept=".xlsx,.xls,.csv" hidden></label>
<button onclick="modele()">Télécharger un modèle</button><br>
Colonnes : caractère · pinyin · sens · histoire · mnémotechnique · contextes (phrase|traduction, séparés par ;)
</div>
<script>
const BASE=[["你","nǐ","tu","Composé de 亻(l'homme) et 尔 (toi).","La personne (亻) en face de toi."],
["好","hǎo","bien, bon","Une femme (女) et un enfant (子).","Une mère avec son enfant : c'est bien."],
["我","wǒ","je, moi","À l'origine, une arme à dents de scie, empruntée ensuite pour dire « moi ».","Moi, je tiens ma hallebarde."],
["是","shì","être","Le soleil (日) au-dessus de 正 (droit, juste).","Sous le soleil, c'est vrai."],
["不","bù","ne… pas","",""],
["人","rén","personne","Pictogramme d'un homme vu de profil qui marche.","Deux jambes qui avancent."],
["中","zhōng","milieu","Un étendard planté au centre d'un cercle.","Une flèche en plein milieu de la cible."],
["国","guó","pays","Une frontière (囗) autour du jade (玉).","Le trésor protégé par les remparts."],
["大","dà","grand","Un homme qui écarte les bras.","« J'ai pêché un poisson grand comme ça ! »"],
["小","xiǎo","petit","Trois petits points, des grains de sable.",""],
["水","shuǐ","eau","Pictogramme d'un cours d'eau avec ses remous.",""],
["山","shān","montagne","Pictogramme de trois pics.",""],
["口","kǒu","bouche","Pictogramme d'une bouche ouverte.",""],
["日","rì","soleil, jour","Un cercle avec un point au centre, devenu carré.",""],
["月","yuè","lune, mois","Un croissant de lune.",""],
["木","mù","arbre","Un tronc, des branches et des racines.",""],
["吃","chī","manger","La bouche (口) et 乞.",""],
["喝","hē","boire","La bouche (口) et 曷.",""],
["茶","chá","thé","L'herbe (艹) au-dessus d'un homme (人) et d'un arbre (木).","Un homme entre les herbes et l'arbre à thé."],
["学","xué","étudier","Un enfant (子) sous un toit, les mains qui manipulent des baguettes à compter.",""],
["一","yī","un","Un trait.",""],["二","èr","deux","Deux traits.",""],["三","sān","trois","Trois traits.",""]];
const CTX={"你":["你好！|Bonjour !","你是老师吗？|Tu es professeur ?","谢谢你。|Merci à toi."],
"好":["你好！|Bonjour !","这个茶很好喝。|Ce thé est très bon.","好的，谢谢。|D'accord, merci."],
"我":["我是学生。|Je suis étudiant.","我喝茶。|Je bois du thé.","我不吃。|Je ne mange pas."],
"是":["我是学生。|Je suis étudiant.","他是中国人。|Il est chinois.","这是什么？|Qu'est-ce que c'est ?"],
"不":["我不吃。|Je ne mange pas.","不是。|Non, ce n'est pas ça.","不好意思。|Excusez-moi."],
"人":["他是中国人。|Il est chinois.","这里人很多。|Il y a beaucoup de monde ici."],
"中":["他是中国人。|Il est chinois.","我学中文。|J'apprends le chinois."],
"国":["他是中国人。|Il est chinois.","你是哪国人？|De quel pays es-tu ?"],
"大":["这个很大。|C'est très grand.","大家好！|Bonjour à tous !"],
"小":["小李是学生。|Xiao Li est étudiant.","这个太小了。|C'est trop petit."],
"水":["我喝水。|Je bois de l'eau.","一瓶水，谢谢。|Une bouteille d'eau, merci."],
"口":["人口很多。|La population est nombreuse.","出口在哪儿？|Où est la sortie ?"],
"日":["今天是我的生日。|Aujourd'hui c'est mon anniversaire.","日本|Japon"],
"月":["一月|janvier","这个月很忙。|Ce mois-ci est chargé."],
"吃":["我不吃。|Je ne mange pas.","你吃饭了吗？|Tu as mangé ?"],
"喝":["我喝茶。|Je bois du thé.","你喝什么？|Qu'est-ce que tu bois ?"],
"茶":["我喝茶。|Je bois du thé.","一杯茶，谢谢。|Une tasse de thé, merci."],
"学":["我是学生。|Je suis étudiant.","我学中文。|J'apprends le chinois."],
"一":["一杯茶，谢谢。|Une tasse de thé, merci.","一月|janvier"],
"三":["三个人|trois personnes"],"二":["二月|février"]};
BASE.forEach(d=>{d[5]=CTX[d[0]]||[]});
const KS="hanzi_srs_v1",KD="hanzi_deck_v1";
let S=JSON.parse(localStorage.getItem(KS)||"{}");
let DECK=JSON.parse(localStorage.getItem(KD)||"null")||BASE;
DECK.forEach(d=>{if(!d[5])d[5]=CTX[d[0]]||[]});
const now=()=>Date.now(),DAY=864e5,$=id=>document.getElementById(id);
function sauver(){localStorage.setItem(KS,JSON.stringify(S));localStorage.setItem(KD,JSON.stringify(DECK))}
function carte(c){return S[c]||(S[c]={ease:2.5,ivl:0,due:0,reps:0})}
function choisir(){const dues=DECK.filter(d=>carte(d[0]).due<=now()&&d!==cur);
 const pool=dues.length?dues:DECK.filter(d=>d!==cur);return pool.sort((a,b)=>carte(a[0]).due-carte(b[0]).due)[0]||DECK[0]}
function noter(c,err){const k=carte(c);
 if(err>2){k.reps=0;k.ivl=0;k.ease=Math.max(1.3,k.ease-0.2);k.due=now()+60e3}
 else{k.reps++;k.ivl=k.reps==1?1:k.reps==2?3:Math.round(k.ivl*k.ease);
  k.ease=err==0?k.ease+0.1:Math.max(1.3,k.ease-0.05);k.due=now()+k.ivl*DAY}
 sauver();return k}
function stats(){const d=DECK.filter(x=>carte(x[0]).due<=now()).length,m=DECK.filter(x=>carte(x[0]).reps>=3).length;
 $("stats").textContent=`À réviser : ${d} · Maîtrisés : ${m}/${DECK.length}`}
function voirHistoire(){const h=cur[3],m=cur[4];
 $("histoire").innerHTML=`<div style="font-size:40px;text-align:center">${cur[0]}</div>`+
  (h?`<b>Histoire :</b> ${h}<br>`:"")+(m?`<b>Mnémo :</b> ${m}<br>`:"")+((cur[5]||[]).length?`<b>Contextes :</b><br>`+cur[5].map(c=>c.replace("|"," — ")).join("<br>"):"")+(!h&&!m?"Pas encore d'histoire pour ce caractère.":"");
 $("histoire").style.display="block"}
let w,cur=null,curCtx="";
function suivant(){cur=choisir();$("histoire").style.display="none";$("suite").style.display="none";
 $("pinyin").textContent=cur[1];$("sens").textContent=cur[2];if(typeof majPy=="function")majPy();
 const cs=cur[5]||[];if(cs.length){const [zh,fr]=cs[Math.floor(Math.random()*cs.length)].split("|");
  $("contexte").textContent=zh.split(cur[0]).join("＿");$("ctxfr").textContent=fr||"";curCtx=zh}else{$("contexte").textContent="";$("ctxfr").textContent="";curCtx=""}$("msg").textContent="Écris le caractère";
 $("target").querySelectorAll("g").forEach(g=>g.remove());
 w=HanziWriter.create("target",cur[0],{width:300,height:300,padding:15,showCharacter:false,showOutline:false,
  strokeColor:"#222",highlightColor:"#a33",drawingWidth:22,showHintAfterMisses:3});
 w.quiz({onComplete:r=>fini(r.totalMistakes)});stats()}
function fini(err){const k=noter(cur[0],err);$("pinyin").style.visibility="visible";if(curCtx)$("contexte").textContent=curCtx;
 $("msg").textContent=(err==0?"Parfait ! ":err<=2?"Bien. ":"À revoir. ")+"Prochaine révision "+(k.ivl?"dans "+k.ivl+" j":"bientôt");
 voirHistoire();$("suite").style.display="inline-block";stats()}
function montrer(){w.cancelQuiz();w.showOutline();w.animateCharacter({onComplete:()=>{w.hideOutline();w.quiz({onComplete:()=>fini(5)})}})}
function indice(){w.showOutline();setTimeout(()=>w.hideOutline(),1200)}
$("fichier").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=ev=>{const wb=XLSX.read(new Uint8Array(ev.target.result),{type:"array"});
  const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""});
  let ajout=0,maj=0;
  rows.forEach(r=>{const c=String(r[0]||"").trim();if(!c||/caract/i.test(c))return;
   const ligne=[c,String(r[1]||""),String(r[2]||""),String(r[3]||""),String(r[4]||""),String(r[5]||"").split(/\s*;\s*/).filter(Boolean)];
   const i=DECK.findIndex(d=>d[0]===c);
   if(i>=0){ligne.forEach((v,j)=>{if(j==5){DECK[i][5]=[...new Set([...(DECK[i][5]||[]),...v])]}else if(v)DECK[i][j]=v});maj++}else{DECK.push(ligne);ajout++}});
  sauver();stats();alert(`${ajout} caractère(s) ajouté(s), ${maj} mis à jour. Progression conservée.`)};
 rd.readAsArrayBuffer(f);e.target.value=""};
function modele(){const ws=XLSX.utils.aoa_to_sheet([["caractère","pinyin","sens","histoire","mnémotechnique","contextes (phrase|traduction ; phrase|traduction)"],["火","huǒ","feu","Pictogramme de flammes qui montent.","Un feu de camp qui crépite.","火车站在哪儿？|Où est la gare ? ; 小心火！|Attention au feu !"]]);
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"caracteres");XLSX.writeFile(wb,"modele_caracteres.xlsx")}
let pyOn=localStorage.getItem("hanzi_py")!=="off";
function majPy(){$("pinyin").style.visibility=pyOn?"visible":"hidden";$("btnPy").textContent=pyOn?"Masquer le pinyin":"Afficher le pinyin";}
function togglePy(){pyOn=!pyOn;localStorage.setItem("hanzi_py",pyOn?"on":"off");majPy()}
majPy();
suivant();
</script></body></html>
